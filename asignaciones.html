<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/styles-global.css">

<body>

    <header class="top-bar">

    <aside class="sidebar-navigation">

        <section class="card-container">

            <form class="form-grid">

                <select id="equipo" class="input-field">

                <select id="usuario" class="input-field">
                    <option value="1">Carlos Gómez (Técnico)</option>
                    <option value="2">Ana Rodríguez (Soporte)</option>
                </select>

                <button type="submit" class="btn-primary">Registrar Préstamo</button>
