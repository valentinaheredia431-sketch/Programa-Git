<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Soluciones Tech</title>
    <link rel="stylesheet" href="css/styles-global.css">
</head>
<body>
    <main class="login-wrapper">
        <section class="login-card card-container">
            <div class="logo">
                <img src="images/logo.png" alt="Logo Soluciones Tech">
            </div>
            <h2>Iniciar Sesión</h2>
            <form action="dashboard.html" class="form-login">
                <label for="email">Correo Institucional:</label>
                <input type="email" id="email" class="input-field" placeholder="usuario@solucionestech.com" required>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                
                <button type="submit" class="btn-primary">Ingresar al Sistema</button>
            </form>
        </section>
    </main>
</body>
</html>
